
services:
  api:
    build:
      context: .
      target: development
    env_file:
      - ./.env
    ports:
      - ${HOST_PORT}:${PORT}
    environment:
      - MYSQL_HOST=db
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db
  db:
    image: mysql:9.7
    environment:
      - MYSQL_ROOT_PASSWORD=${uma_senha_bastante_forte}
      - MYSQL_DATABASE=${smartnotes}
      - MYSQL_USER=${app}
      - MYSQL_PASSWORD=${outra_senha_bastante_forte}
    volumes:
      - mysql-data:/var/lib/mysql
  pma:
    image: phpmyadmin
    restart: always
    ports:
      - 8080:80
    environment:
      - PMA_ARBITRARY=1

volumes:
  mysql-data: